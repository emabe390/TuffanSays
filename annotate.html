<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat Mouth Annotator</title>
<style>
  body { font-family: sans-serif; padding: 20px; max-width: 900px; margin: auto; }
  img { max-width: 100%; border: 2px solid #333; cursor: crosshair; display: block; }
  .controls { margin: 15px 0; display: flex; gap: 10px; align-items: center; }
  pre { background: #f4f4f4; padding: 10px; overflow: auto; max-height: 200px; }
  .marker {
    position: absolute; width: 12px; height: 12px; background: red;
    border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
    border: 2px solid white;
  }
  .img-wrap { position: relative; display: inline-block; }
</style>
</head>
<body>
<h1>Cat Mouth Annotator</h1>
<p>Click on the cat's mouth to set the coordinates. Use the buttons to navigate between images.</p>

<div class="controls" id="fileControls" style="display:none;">
  <label>Load <code>cat_photos.json</code>: <input type="file" id="jsonFile" accept=".json"></label>
</div>

<div class="controls">
  <button id="prevBtn">Previous</button>
  <span id="counter">1 / 1</span>
  <button id="nextBtn">Next</button>
  <button id="saveBtn">Download Updated JSON</button>
</div>

<div class="img-wrap" id="imgWrap">
  <img id="catImg" src="" alt="Cat">
</div>

<p id="status"></p>

<h2>Updated cat_photos.json</h2>
<pre id="jsonOut"></pre>

<script>
let photos = [];
let current = 0;

async function load() {
  try {
    const res = await fetch('cat_photos.json');
    if (!res.ok) throw new Error('not ok');
    photos = await res.json();
    show(current);
  } catch (e) {
    document.getElementById('fileControls').style.display = 'flex';
    document.getElementById('status').textContent = 'Cannot auto-load JSON over file://. Please select cat_photos.json below.';
  }
}

function show(index) {
  current = index;
  const p = photos[current];
  const img = document.getElementById('catImg');
  const wrap = document.getElementById('imgWrap');
  img.src = p.file;
  document.getElementById('counter').textContent = `${current + 1} / ${photos.length}`;

  // clear old markers
  wrap.querySelectorAll('.marker').forEach(m => m.remove());

  img.onload = () => {
    if (p.mouth) {
      placeMarker(p.mouth.x, p.mouth.y);
    }
  };

  updateJson();
}

function placeMarker(nx, ny) {
  const img = document.getElementById('catImg');
  const wrap = document.getElementById('imgWrap');
  wrap.querySelectorAll('.marker').forEach(m => m.remove());
  const m = document.createElement('div');
  m.className = 'marker';
  // Convert natural coordinates back to rendered coordinates for display
  const scaleX = img.naturalWidth ? (img.clientWidth / img.naturalWidth) : 1;
  const scaleY = img.naturalHeight ? (img.clientHeight / img.naturalHeight) : 1;
  m.style.left = (nx * scaleX) + 'px';
  m.style.top = (ny * scaleY) + 'px';
  wrap.appendChild(m);
}

function updateJson() {
  document.getElementById('jsonOut').textContent = JSON.stringify(photos, null, 2);
}

document.getElementById('catImg').addEventListener('click', (e) => {
  const img = e.target;
  const rect = img.getBoundingClientRect();
  const rx = e.clientX - rect.left;
  const ry = e.clientY - rect.top;
  // Store coordinates in natural image pixel space so they scale correctly on the main site
  const nx = img.naturalWidth ? Math.round(rx * (img.naturalWidth / img.clientWidth)) : Math.round(rx);
  const ny = img.naturalHeight ? Math.round(ry * (img.naturalHeight / img.clientHeight)) : Math.round(ry);
  photos[current].mouth = { x: nx, y: ny };
  placeMarker(nx, ny);
  updateJson();
  document.getElementById('status').textContent = `Set mouth for image ${current + 1} to natural coords (${nx}, ${ny})`;
});

document.getElementById('prevBtn').addEventListener('click', () => {
  if (current > 0) show(current - 1);
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if (current < photos.length - 1) show(current + 1);
});
document.getElementById('saveBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(photos, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'cat_photos.json';
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('jsonFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      photos = JSON.parse(ev.target.result);
      show(current);
      document.getElementById('status').textContent = 'Loaded ' + photos.length + ' photos.';
    } catch (err) {
      document.getElementById('status').textContent = 'Invalid JSON: ' + err.message;
    }
  };
  reader.readAsText(file);
});

load();
</script>
</body>
</html>
